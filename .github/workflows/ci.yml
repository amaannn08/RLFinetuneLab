name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pip install -e .

      - name: Validate Configurations
        run: |
          rlfinetune validate-config --config configs/sft/qwen2.5_0.5b_qlora.yaml
          rlfinetune validate-config --config configs/dpo/qwen2.5_0.5b_dpo.yaml
          rlfinetune validate-config --config configs/grpo/qwen2.5_0.5b_grpo.yaml
          rlfinetune validate-config --config configs/eval/benchmark_eval.yaml

      - name: Run Unit & Integration Tests
        run: |
          pytest tests/ -v --durations=10

      - name: Run In-Memory Smoke Test
        run: |
          python scripts/run_smoke_test.py
