# =====================================================================
# RLFinetuneLab Base Configuration Template
# Standard reference setup for Small Language Models (e.g. Qwen2.5 / Llama-3.2)
# =====================================================================

project_name: "RLFinetuneLab"
stage: "sft" # Options: sft, dpo, grpo, eval, export, serve, smoke
run_name: "qwen2.5_0.5b_base_run"

# --- Model & Tokenizer ---
model:
  name_or_path: "Qwen/Qwen2.5-0.5B-Instruct"
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa" # 'flash_attention_2' (requires Ampere+), 'sdpa' (PyTorch 2.x), or 'eager'
  use_fast_tokenizer: true
  trust_remote_code: true
  device_map: "auto"

# --- Quantization (QLoRA 4-bit / 8-bit) ---
quantization:
  load_in_4bit: true
  load_in_8bit: false
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

# --- PEFT / LoRA Adapter ---
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

# --- Dataset Specification ---
dataset:
  train_file: null # Path to JSON/JSONL dataset or leave null for HuggingFace hub
  eval_file: null
  dataset_name: "HuggingFaceH4/no_robots"
  dataset_split: "train"
  prompt_field: "prompt"
  response_field: "messages"
  format_type: "chatml"
  max_train_samples: 5000
  max_eval_samples: 500

# --- SFT Training Parameters ---
sft:
  output_dir: "outputs/sft"
  num_train_epochs: 3.0
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_seq_length: 2048
  gradient_checkpointing: true
  packing: false
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 2
  bf16: true
  report_to:
    - "tensorboard"

# --- DPO Training Parameters ---
dpo:
  output_dir: "outputs/dpo"
  num_train_epochs: 2.0
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-6
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  beta: 0.1
  loss_type: "sigmoid"
  max_prompt_length: 1024
  max_target_length: 1024
  max_seq_length: 2048
  gradient_checkpointing: true
  logging_steps: 5
  save_steps: 50
  eval_steps: 50
  bf16: true
  report_to:
    - "tensorboard"

# --- GRPO Training Parameters ---
grpo:
  output_dir: "outputs/grpo"
  num_train_epochs: 1.0
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-6
  num_generations: 4
  max_prompt_length: 512
  max_completion_length: 512
  temperature: 0.8
  beta: 0.04
  epsilon: 0.2
  reward_funcs:
    - "accuracy"
    - "format"
  gradient_checkpointing: true
  logging_steps: 5
  save_steps: 50
  bf16: true
  report_to:
    - "tensorboard"

# --- Evaluation Harness ---
eval:
  metrics:
    - "perplexity"
    - "generation"
  eval_batch_size: 4
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9

# --- Serving Configuration ---
serving:
  host: "0.0.0.0"
  port: 8000
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.85
  max_model_len: 4096
