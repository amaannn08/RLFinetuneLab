project_name: "RLFinetuneLab"
stage: "dpo"
run_name: "qwen2.5_0.5b_dpo"

model:
  name_or_path: "Qwen/Qwen2.5-0.5B-Instruct"
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"
  use_fast_tokenizer: true
  trust_remote_code: true
  device_map: "auto"

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"

dataset:
  dataset_name: "argilla/dpo-mix-7k"
  dataset_split: "train"
  prompt_field: "prompt"
  chosen_field: "chosen"
  rejected_field: "rejected"
  format_type: "chatml"
  max_train_samples: 2000
  max_eval_samples: 200

dpo:
  output_dir: "outputs/dpo_qwen0.5b"
  num_train_epochs: 2.0
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-6
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  beta: 0.1
  loss_type: "sigmoid"
  max_prompt_length: 512
  max_target_length: 512
  max_seq_length: 1024
  gradient_checkpointing: true
  logging_steps: 5
  save_steps: 50
  bf16: true
  report_to:
    - "tensorboard"
