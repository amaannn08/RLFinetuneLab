project_name: "RLFinetuneLab"
stage: "sft"
run_name: "qwen2.5_0.5b_sft_qlora"

model:
  name_or_path: "Qwen/Qwen2.5-0.5B-Instruct"
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"
  use_fast_tokenizer: true
  trust_remote_code: true
  device_map: "auto"

quantization:
  load_in_4bit: true
  load_in_8bit: false
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

dataset:
  dataset_name: "HuggingFaceH4/no_robots"
  dataset_split: "train"
  prompt_field: "prompt"
  response_field: "messages"
  format_type: "chatml"
  max_train_samples: 3000
  max_eval_samples: 300

sft:
  output_dir: "outputs/sft_qwen0.5b"
  num_train_epochs: 2.0
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_seq_length: 1024
  gradient_checkpointing: true
  packing: false
  logging_steps: 10
  save_steps: 50
  eval_steps: 50
  save_total_limit: 2
  bf16: true
  report_to:
    - "tensorboard"
