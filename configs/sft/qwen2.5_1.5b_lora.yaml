project_name: "RLFinetuneLab"
stage: "sft"
run_name: "qwen2.5_1.5b_sft_lora"

model:
  name_or_path: "Qwen/Qwen2.5-1.5B-Instruct"
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"
  use_fast_tokenizer: true
  trust_remote_code: true
  device_map: "auto"

quantization:
  load_in_4bit: false
  load_in_8bit: false

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

dataset:
  dataset_name: "HuggingFaceH4/no_robots"
  dataset_split: "train"
  format_type: "chatml"
  max_train_samples: 5000
  max_eval_samples: 500

sft:
  output_dir: "outputs/sft_qwen1.5b"
  num_train_epochs: 3.0
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 1.5e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_seq_length: 2048
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 100
  bf16: true
  report_to:
    - "tensorboard"
